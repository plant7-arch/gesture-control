# gesture-control configuration: the reference copy of every setting.
#
# DON'T EDIT THIS FILE - new builds overwrite it. Put your changes in
# config/local.yaml instead: same structure, only the settings you change.
# It is loaded last and never shipped in a build, e.g.:
#   pinch:
#     start: 0.32
#
# README.md > Configuration explains every setting. Restart the app after editing.

camera:
  index: 0              # /dev/video0
  width: 640
  height: 480
  fps: 30               # your built-in webcam maxes out at 30
  fourcc: MJPG
  mirror: true          # mirror view, so moving right moves the cursor right
  lock_framerate: true  # stop auto-exposure dropping to 15 fps in dim light
  buffers: 2            # camera frame buffers. 1 makes many cameras skip frames
                        #   (20 fps instead of 30); more than 2 isn't needed

tracker:
  model: models/hand_landmarker.task   # relative to the project root
  num_hands: 2           # 2 for two-hand zoom; 1 if you don't use zoom
  second_hand_check_every: 5  # with one hand in view, look for a second hand every N
                              #   frames (finding one switches to full two-hand tracking).
                              #   1 = every frame: zoom starts sooner, but costs about
                              #   twice the CPU per frame
  min_detection_confidence: 0.6
  min_presence_confidence: 0.6
  min_tracking_confidence: 0.5

pose:
  # A finger counts as "up" when wrist->tip is this many times wrist->middle-joint,
  # and "curled" below curl_ratio. Typical: up ~1.3-1.5, curled ~0.6-0.8.
  extend_ratio: 1.15
  curl_ratio: 0.95
  debounce_frames: 3    # a pose must hold this many frames (~100 ms) to count

pinch:
  # Thumb-to-fingertip distance, relative to palm size (the L / R bars in the preview).
  # A pinch is armed (label lit in the preview) once the fingers are seen apart past
  # the release tick; only an armed pinch can click. So a resting thumb never clicks.
  start: 0.28           # pinch begins below this...
  release: 0.42         # ...and ends above this (the gap prevents flicker)
  confirm_frames: 3       # frames below start before it counts (~100 ms)
  min_finger_reach: 1.05  # left pinch: ignore it while the index finger is curled
                          #   into a fist
  right_min_reach: 0.0    # right pinch: same check for the middle finger; 0 = off,
                          #   since the thumb often taps a bent middle finger
  min_facing: 0.6         # only start pinches when the hand faces the camera
                          # (1 = square on, 0 = edge-on). Turned hands make fingertips
                          # line up and look touching. Shown as the facing value.

cursor:
  mode: relative        # relative: works like a touchpad. Slow hand movement = fine
                        #   control, fast movement = big jumps. To reposition your hand,
                        #   open your palm (cursor stops), move, then point again.
                        # absolute: hand position = screen position (box = screen).
                        #   Simple, but each camera pixel is 5+ screen pixels.
  anchor: knuckles      # knuckles: average of the 4 knuckles (steadiest; doesn't move
                        #   when you pinch) | index_mcp | index_tip | palm_center
  click_freeze_ms: 180  # hold the cursor still briefly when a click starts

  relative:
    # Hand movement is measured in palm lengths (wrist to middle knuckle, about 9 cm),
    # so it feels the same however far you sit from the camera.
    # Gain = screen widths of cursor travel per palm length of hand travel. It rises
    # smoothly from gain_slow to gain_fast as hand speed goes from speed_slow to
    # speed_fast (palm lengths per second).
    gain_slow: 0.05     # lower = more precise when moving slowly (0.05 = 96 px on 1920)
    gain_fast: 0.4      # higher = less arm movement to cross the screen
    speed_slow: 0.6
    speed_fast: 5.0
    min_speed: 0.15     # slower than this counts as holding still (hides jitter)
    screen_aspect: auto # screen width / height, auto = read from GNOME (else 1.6);
                        # or a number: 1.6 for 16:10, 1.78 for 16:9
    output: auto        # auto: trackball once its one-time setup is done, else tablet
                        # trackball: relative movement from wherever the real pointer is
                        #   (works alongside your mouse/touchpad; README > one-time setup)
                        # tablet: absolute positions the app keeps itself (no setup, but
                        #   the cursor jumps back after you use your real mouse)
                        # mouse: plain relative mouse events (GNOME acceleration applies)
    trackball_counts: [0, 0]     # [0, 0] = automatic (screen size, scale and mouse
                                 # speed from GNOME); --calibrate-trackball measures
                                 # them instead (saved in calibration.yaml)
    trackball_mouse_speed: null  # GNOME mouse speed at calibration time
    mouse_px_per_screen: 1920  # output: mouse only - counts per screen width
    filter:             # One Euro filter
      min_cutoff: 1.0   # lower = steadier when still, but more lag
      beta: 4.0         # higher = less lag on fast moves, but more jitter
      d_cutoff: 1.0

  # Absolute mode only:
  region:               # part of the camera view mapped to the whole screen
    x_min: 0.2
    x_max: 0.8
    y_min: 0.2
    y_max: 0.7
  filter:               # One Euro filter
    min_cutoff: 1.0
    beta: 10.0
    d_cutoff: 1.0
  abs_scale: [1.0, 1.0] # set by --calibrate (saved in config/calibration.yaml, which
                        # wins). Also used by relative mode with output: tablet.
  deadzone: 0.0015      # ignore cursor changes smaller than this (fraction of screen)

scroll:
  # Peace sign = finger on the glass. Move up/down or left/right to scroll; leave the
  # pose while the hand is still moving (open palm, curl the fingers) to fling, like a
  # phone. Everything below works the same in both directions.
  notches_per_height: 25  # wheel notches for moving your hand the full frame height
                          #   (sideways: the same hand distance scrolls the same amount)
  direction: natural      # natural: content follows your hand, like a phone (hand up =
                          #   page moves up, hand right = page moves right)
                          #   | traditional: like a mouse wheel
  horizontal: true        # also scroll sideways (false: up/down only)
  axis_lock: true         # each swipe scrolls along one axis only (the one your hand
                          #   moves along first), so a slightly slanted swipe doesn't
                          #   drift sideways. false: scroll freely in any direction
  method: touchpad        # touchpad: sent as a two-finger swipe on a virtual touchpad,
                          #   so apps pan like with your laptop touchpad (image viewer,
                          #   maps, pinch-zoomed pages) | wheel: sent as a mouse wheel
                          #   (the image viewer then zooms instead of panning)
  touchpad:
    mm_per_notch: 5.0     # finger travel for one wheel notch's worth of scrolling.
                          #   Higher = scrolls further for the same hand movement
  deadzone: 0.0015
  settle_ms: 200          # ignore movement just after switching to the scroll pose
  fling:
    enabled: true
    min_speed: 0.8        # hand speed at lift (frame heights per second, any direction)
                          #   needed to fling
    boost: 2.0            # glide speed = swipe speed x boost. Higher = flings go further;
                          #   dragging is unaffected. 1.0 = glide at exactly swipe speed
    boost_ramp_s: 0.15    # the glide starts at your drag speed and eases up to the boosted
                          #   speed over about this long, so drag and glide feel continuous
    time_constant_s: 0.45 # how long the glide lasts: higher = longer, further
    max_notches_per_s: 300 # speed limit for any glide, stacked or not
    stack:
      # Flick again while the page glides: the peace sign catches the glide, and a quick
      # swipe the same way adds the caught speed to the new fling. Repeated flicks keep
      # accelerating, like a phone.
      enabled: true
      window_s: 1.0       # max time from catching the glide to releasing the next swipe
      factor: 1.0         # share of the caught speed carried over (0.5 = half)
      settle_ms: 60       # settle time after a catch (normal touches use settle_ms above)
  filter:
    min_cutoff: 1.0
    beta: 5.0
    d_cutoff: 1.0

zoom:
  # Two hands, both index fingers up: spread them apart to zoom in, bring them together
  # to zoom out. Clicks and cursor movement pause while zooming.
  enabled: true
  method: touchpad        # touchpad: a true two-finger pinch on a virtual touchpad
                          #   (smooth, centred on the pointer; needs the touchpad turned
                          #   on in Settings and an app with pinch support)
                          # ctrl_scroll: Ctrl + smooth wheel (works in more apps, in steps)
                          # keys: Ctrl+= / Ctrl+- taps, for apps without Ctrl+wheel
  touchpad:
    gain: 1.0             # fingers spread = hands spread ^ gain. 1.5 = zoom faster
    start_mm: 45          # finger distance when the pinch starts (fingers sit on a
                          #   diagonal, so libinput never mistakes the pinch for a scroll)
    width_mm: 100         # size of the virtual touchpad
    height_mm: 65
  invert: false           # true = spread to zoom out (every method)
  settle_ms: 150          # ignore movement just after both hands start pointing
  # ctrl_scroll / keys only:
  notch_ratio: 1.15       # spreading hands 15% further = one zoom step. Lower = zoom faster
  deadzone: 0.004         # ignore tiny spread changes (log scale) so still hands don't zoom
  ctrl_release_ms: 400    # ctrl_scroll: let go of Ctrl after the hands are still this long
  filter:                 # One Euro filter on the hand spread (every method)
    min_cutoff: 1.0
    beta: 2.0
    d_cutoff: 1.0

double_click:
  # Pinch twice quickly (thumb + index) for a double click. A second pinch within
  # window_ms of letting go of the first, with the cursor still near the first click,
  # snaps back to that spot and is sent as a guaranteed double click.
  enabled: true
  window_ms: 700        # longer = more relaxed timing, but two separate clicks on the
                        #   same spot may merge into a double click
  max_move: 0.02        # how far the cursor may drift between the pinches (fraction
                        #   of screen width, 0.02 = about 38 px on 1920)
  os_time_ms: auto      # auto = read GNOME's double-click time (default 400)

pause:
  fist_hold_s: 1.0      # hold a fist this long to pause / resume
  start_paused: false

safety:
  lost_hand_release_frames: 8   # release any held button after the hand is gone this long

phone:
  # An Android phone as the camera, through scrcpy (README > Phone as the camera).
  # With enabled: true (or --phone), the app starts scrcpy itself, uses the phone's
  # picture, and stops scrcpy when it quits.
  enabled: false
  facing: back          # back (the better camera) | front | external
  size: 640x480         # one of: scrcpy --video-source=camera --list-camera-sizes
                        #   (640x480 matches a laptop webcam; bigger doesn't track better)
  fps: 30               # 30 is the most phones offer outside high-speed mode
  bit_rate: 8M          # video quality over the cable or Wi-Fi; lower it if it stutters
  video_device: 10      # the virtual camera: /dev/video10 (v4l2loopback video_nr)
  connect: ""           # empty: USB. For Wi-Fi: the address from Wireless debugging,
                        #   e.g. 192.168.1.42:41234 (the port changes when it's turned on)
  serial: ""            # only with several phones or connections: which one (adb devices)
  start_timeout_s: 20   # give up if the picture hasn't started by then
  extra_args: []        # more scrcpy options, e.g. [--camera-ar=4:3]

preview:
  enabled: true
  window_name: gesture-control
  show_landmarks: true
