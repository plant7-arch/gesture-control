# gesture-control configuration.
# Anything you delete from this file falls back to the built-in default.
# Tip: watch the numbers in the preview window while tuning.
#
# New builds overwrite this file. Put your own changes in config/local.yaml
# instead (same structure, only the keys you change); it is loaded last and
# never shipped in a build, e.g.:
#   pinch:
#     start: 0.32

camera:
  index: 0              # /dev/video0
  width: 640
  height: 480
  fps: 30               # your built-in webcam maxes out at 30
  fourcc: MJPG
  mirror: true          # mirror view, so moving right moves the cursor right
  lock_framerate: true  # stop auto-exposure dropping to 15 fps in dim light

tracker:
  model: models/hand_landmarker.task   # relative to the project root
  num_hands: 1
  min_detection_confidence: 0.6
  min_presence_confidence: 0.6
  min_tracking_confidence: 0.5

pose:
  # A finger counts as "up" when wrist->tip is this many times wrist->middle-joint,
  # and "curled" below curl_ratio. Typical: up ~1.3-1.5, curled ~0.6-0.8.
  extend_ratio: 1.15
  curl_ratio: 0.95
  debounce_frames: 3    # a pose must hold this many frames (~100 ms) to count

pinch:
  # Thumb-to-fingertip distance, relative to palm size (the L / R bars in the preview).
  start: 0.28           # pinch begins below this...
  release: 0.42         # ...and ends above this (the gap prevents flicker)
  confirm_frames: 3       # frames below start before it counts (~100 ms)
  min_finger_reach: 1.05  # ignore pinches while the finger is curled into a fist
  min_facing: 0.6         # only start pinches when the hand faces the camera
                          # (1 = square on, 0 = edge-on). Turned hands make fingertips
                          # line up and look touching. Shown as the facing value.

cursor:
  mode: relative        # relative: works like a touchpad. Slow hand movement = fine
                        #   control, fast movement = big jumps. To reposition your hand,
                        #   open your palm (cursor stops), move, then point again.
                        # absolute: hand position = screen position (box = screen).
                        #   Simple, but each camera pixel is 5+ screen pixels.
  anchor: knuckles      # knuckles: average of the 4 knuckles (steadiest; doesn't move
                        #   when you pinch) | index_mcp | index_tip | palm_center
  click_freeze_ms: 180  # hold the cursor still briefly when a click starts

  relative:
    # Hand movement is measured in palm lengths (wrist to middle knuckle, about 9 cm),
    # so it feels the same however far you sit from the camera.
    # Gain = screen widths of cursor travel per palm length of hand travel. It rises
    # smoothly from gain_slow to gain_fast as hand speed goes from speed_slow to
    # speed_fast (palm lengths per second).
    gain_slow: 0.05     # lower = more precise when moving slowly (0.05 = 96 px on 1920)
    gain_fast: 0.4      # higher = less arm movement to cross the screen
    speed_slow: 0.6
    speed_fast: 5.0
    min_speed: 0.15     # slower than this counts as holding still (hides jitter)
    screen_aspect: 1.6  # screen width / height (1.6 for 16:10, 1.78 for 16:9)
    output: tablet      # tablet: drive the calibrated absolute device (no GNOME
                        #   acceleration on top; uses --calibrate) | mouse: plain
                        #   relative mouse events (GNOME acceleration applies)
    mouse_px_per_screen: 1920  # output: mouse only - counts per screen width
    filter:             # One Euro filter
      min_cutoff: 1.0   # lower = steadier when still, but more lag
      beta: 4.0         # higher = less lag on fast moves, but more jitter
      d_cutoff: 1.0

  # Absolute mode only:
  region:               # part of the camera view mapped to the whole screen
    x_min: 0.2
    x_max: 0.8
    y_min: 0.2
    y_max: 0.7
  filter:               # One Euro filter
    min_cutoff: 1.0
    beta: 10.0
    d_cutoff: 1.0
  abs_scale: [1.0, 1.0] # set by --calibrate (saved in config/calibration.yaml, which
                        # wins). Also used by relative mode with output: tablet.
  deadzone: 0.0015      # ignore cursor changes smaller than this (fraction of screen)

scroll:
  notches_per_height: 25  # wheel notches for moving your hand the full frame height
  invert: false           # true = move hand up to scroll down
  deadzone: 0.0015
  settle_ms: 200          # ignore movement just after switching to the scroll pose
  filter:
    min_cutoff: 1.0
    beta: 5.0
    d_cutoff: 1.0

double_click:
  # Pinch twice quickly (thumb + index) for a double click. A second pinch within
  # window_ms of letting go of the first, with the cursor still near the first click,
  # snaps back to that spot and is sent as a guaranteed double click.
  enabled: true
  window_ms: 700        # longer = more relaxed timing, but two separate clicks on the
                        #   same spot may merge into a double click
  max_move: 0.02        # how far the cursor may drift between the pinches (fraction
                        #   of screen width, 0.02 = about 38 px on 1920)
  os_time_ms: auto      # auto = read GNOME's double-click time (default 400)

pause:
  fist_hold_s: 1.0      # hold a fist this long to pause / resume
  start_paused: false

safety:
  lost_hand_release_frames: 8   # release any held button after the hand is gone this long

preview:
  enabled: true
  window_name: gesture-control
  show_landmarks: true
